name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw 'Use a version tag such as v0.1.0 or v0.1.0-beta.1.'
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - run: dotnet run --project tests/Recap.ProcessingTests --configuration Release
      - name: Publish and checksum
        shell: pwsh
        run: |
          ./build.ps1 -Version $env:RELEASE_VERSION
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Copy-Item artifacts/win-x64/Recap.exe artifacts/release/Recap-win-x64.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/release/
          $hash = (Get-FileHash artifacts/release/Recap-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Recap-win-x64.exe" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
      - name: Sign update manifest
        shell: pwsh
        env:
          RECAP_UPDATE_SIGNING_KEY: ${{ secrets.RECAP_UPDATE_SIGNING_KEY }}
        run: ./tools/Sign-Update.ps1 -PackagePath artifacts/release/Recap-win-x64.exe -OutputDirectory artifacts/release -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download built assets and create draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name release-files --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release assets.' }
          @'
          Windows x64, self-contained single executable. Requires your own speech/AI credentials.

          Maintainer checklist before publishing:
          - Test recording, playback and speech recognition on a clean Windows installation.
          - Review third-party SDK redistribution terms and notices.
          - Consider Authenticode signing to reduce Windows unknown-publisher warnings.

          The update manifest is RSA-SHA256 signed and verified by Recap's embedded public key. The executable is not Authenticode-signed.
          SHA256SUMS.txt alone is only an integrity checksum; in-app updates require update-manifest.json and update-manifest.sig.
          The opt-in updater checks published stable releases only, requires confirmation, and preserves settings and recordings.
          Releases older than 0.2.0 require one manual upgrade to obtain the updater.
          '@ | Set-Content release-notes.md
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "Recap $env:GITHUB_REF_NAME" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
